{% extends "base.html" %}

{% block title %}ホーム - 防災アプリ{% endblock %}

{% block content %}
<div class="home-top">
    <section class="home-section home-map-card" aria-labelledby="map-heading">
        <h2 id="map-heading" class="section-heading"><span class="heading-icon">📍</span>避難所マップ</h2>
        <div id="shelterMap"></div>
    </section>
</div>

<section class="home-section" aria-labelledby="weather-heading">
    <div class="weather-heading-row">
        <h2 id="weather-heading" class="section-heading"><span class="heading-icon">☁</span>青森市 気象警報・注意報</h2>
        <span class="refresh-label">↻ 10分おき自動更新</span>
    </div>
    <div id="weatherContent" class="weather-panel">
        <p>読み込み中...</p>
    </div>
</section>

<section class="home-section landslide-section" aria-labelledby="landslide-heading">
    <div class="weather-heading-row">
        <h2 id="landslide-heading" class="section-heading"><span class="heading-icon">⛰</span>土砂災害関連情報</h2>
        <span class="level-label">警戒レベル4相当</span>
    </div>
    <div class="landslide-panel">
        <p id="landslideStatus"><strong>読み込み中...</strong></p>
        <p id="landslideGuidance" class="weather-meta">大雨のときは、気象庁の危険度分布と避難所情報をあわせて確認してください。</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8221, 140.7474], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const mapShelters = {{ map_shelters | tojson }};
    function statusClass(status) {
        return { '◎': 'good', '○': 'normal', '△': 'caution', '×': 'bad' }[status] || 'unknown';
    }
    function openingClass(status) {
        return status === '開設中' ? 'open' : status === '開設準備中' ? 'preparing' : 'closed';
    }
    function shelterIcon(shelter) {
        return L.divIcon({
            className: 'shelter-marker',
            html: `<span class="shelter-pin shelter-pin--${openingClass(shelter.opening_status)}"></span>`,
            iconSize: [20, 20],
            iconAnchor: [10, 20],
            popupAnchor: [0, -20]
        });
    }
    function shelterPopup(shelter) {
        const value = function (field) { return shelter[field] || '未登録'; };
        return `<strong>${shelter.name}</strong><br>`
            + `住所：${value('address')}<br>`
            + `電話番号：${value('contact')}<br>`
            + `開催状況：${value('opening_status')}<br>`
            + `混雑状況：<span class="popup-status--${statusClass(shelter.crowd_status)}">${value('crowd_status')}</span><br>`
            + `物資状況：<span class="popup-status--${statusClass(shelter.supply_status)}">${value('supply_status')}</span><br>`
            + `被害状況：<span class="popup-status--${statusClass(shelter.damage_status)}">${value('damage_status')}</span>`;
    }
    mapShelters.forEach(function (shelter) {
        L.marker([shelter.latitude, shelter.longitude], { icon: shelterIcon(shelter) })
            .addTo(map)
            .bindPopup(shelterPopup(shelter));
    });

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');
        updateLandslideContent(data);

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-ok">現在、気象情報を取得できません</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-ok">● 現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p>📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">♨ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    function updateLandslideContent(data) {
        const status = document.getElementById('landslideStatus');
        const guidance = document.getElementById('landslideGuidance');
        if (data.error) {
            status.innerHTML = '<strong>土砂災害関連情報を取得できません</strong>';
            guidance.textContent = '気象庁の情報を確認できるまで、最新の避難情報を確認してください。';
            return;
        }

        const landslideWarning = (data.warnings || []).find(warning =>
            warning.code === '09' || warning.code === '29'
        );

        if (!landslideWarning) {
            status.innerHTML = '<strong class="weather-ok">土砂災害関連の警報・注意報は発表されていません</strong>';
            guidance.textContent = '大雨のときは、気象庁の危険度分布と避難所情報をあわせて確認してください。';
            return;
        }

        status.innerHTML = `<strong class="landslide-alert">${landslideWarning.name}が発表されています</strong>`;
        guidance.textContent = '対象区域では、自治体からの避難情報と危険度分布を確認してください。';
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
