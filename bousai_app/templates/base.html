<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2d5eaa;
      --blue-dark: #24529b;
      --text: #244e91;
      --muted: #687b91;
      --green: #22a35a;
      --surface: #ffffff;
      --page: #f7f9fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #33465d;
      background: var(--page);
      font-family: "Noto Sans JP", sans-serif;
      font-size: 14px;
    }

    .site-header {
      position: relative;
      z-index: 1000;
      height: 54px;
      color: white;
      background: var(--blue);
      box-shadow: 0 1px 5px rgba(25, 60, 110, .2);
    }

    .header-inner {
      width: min(1080px, calc(100% - 32px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      margin: 0;
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .app-hamburger {
      position: absolute;
      top: 12px;
      right: max(16px, calc((100% - 1080px) / 2));
      z-index: 1002;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      width: 34px;
      height: 30px;
      padding: 5px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .app-hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: white;
    }

    .site-nav {
      position: absolute;
      top: 54px;
      right: max(16px, calc((100% - 1080px) / 2));
      z-index: 1001;
      display: none;
      min-width: 180px;
      padding: 10px 0;
      background: var(--blue-dark);
      box-shadow: 0 4px 10px rgba(25, 60, 110, .25);
    }

    .site-nav.is-open { display: block; }

    .site-nav a {
      display: block;
      padding: 8px 16px;
      color: white;
      text-decoration: none;
    }

    .site-nav a:hover,
    .site-nav a:focus { background: rgba(255, 255, 255, .12); }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 25px auto 48px;
    }

    .home-top {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .home-map-card {
      min-height: 284px;
    }

    .home-section {
      margin-bottom: 27px;
      padding: 20px 21px 24px;
      border: 1px solid #edf1f6;
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(42, 72, 105, .07);
    }

    .section-heading {
      margin: 0 0 14px;
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
    }

    .heading-icon { margin-right: 7px; }

    #shelterMap {
      height: 284px;
      overflow: hidden;
      border-radius: 9px;
    }

    .search-page h2 {
      margin: 0 0 18px;
      color: var(--text);
      font-size: 24px;
    }

    .search-map {
      height: 360px;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 9px;
      background: #e8eef4;
    }

    .shelter-search-form {
      max-width: 560px;
      padding: 20px;
      border: 1px solid #edf1f6;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(42, 72, 105, .07);
    }

    .shelter-search-form p {
      margin: 0 0 12px;
      color: var(--text);
      font-weight: 700;
    }

    .shelter-search-form label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .shelter-search-form select {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: none;
      border-radius: 4px;
      color: #33465d;
      background: #f1f5f8;
      font: inherit;
    }

    .shelter-search-form button {
      min-width: 110px;
      min-height: 40px;
      margin-top: 16px;
      padding: 8px 20px;
      border: 0;
      border-radius: 4px;
      color: white;
      background: var(--blue);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .shelter-search-form button:hover,
    .shelter-search-form button:focus { background: var(--blue-dark); }

    .weather-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .refresh-label {
      flex: 0 0 auto;
      color: var(--green);
      font-weight: 700;
    }

    .weather-panel {
      min-height: 137px;
      padding: 14px 15px 10px;
      border-radius: 8px;
      background: #f7f8fa;
    }

    .weather-panel p { margin: 0 0 10px; }
    .weather-panel p:last-child { margin-bottom: 0; }
    .weather-ok { color: var(--green); font-weight: 700; }
    .weather-meta { color: var(--muted); font-size: 12px; }

    .level-label {
      flex: 0 0 auto;
      color: #b06c16;
      font-size: 12px;
      font-weight: 700;
    }

    .landslide-section { padding-bottom: 20px; }
    .landslide-panel {
      padding: 13px 15px 11px;
      border-left: 4px solid #f0b34e;
      border-radius: 5px;
      background: #fffaf0;
    }
    .landslide-panel p { margin: 0 0 8px; }
    .landslide-panel p:last-child { margin-bottom: 0; }
    .landslide-alert { color: #c7442e; }

    @media (max-width: 560px) {
      main { width: min(100% - 20px, 1080px); margin-top: 16px; }
      .home-top { grid-template-columns: 1fr; }
      .home-map-card { min-height: auto; }
      .home-section { padding: 16px 14px 18px; }
      .weather-heading-row { align-items: flex-start; flex-direction: column; gap: 2px; }
      #shelterMap { height: 250px; }
      .app-hamburger { right: 10px; }
      .site-nav { right: 10px; }
      .search-map { height: 280px; }
      .shelter-search-form { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand">防災アプリ</h1>
      <button class="app-hamburger" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="app-navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav id="app-navigation" class="site-nav" aria-label="アプリメニュー">
      <a href="/">ホーム</a>
      <a href="/login">ログイン</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/all_shelters">避難所一覧</a>
      <a href="/board">指示ボード</a>
      <a href="/search_results">検索結果</a>
      <a href="/logout">ログアウト</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.app-hamburger');
    const siteNav = document.querySelector('.site-nav');
    menuButton.addEventListener('click', function() {
      const isOpen = siteNav.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
  </script>
</body>
</html>
