{% extends "base.html" %}

{% block title %}避難所検索 - 防災アプリ{% endblock %}

{% block content %}
<section class="search-page" aria-labelledby="shelter-search-heading">
	<h2 id="shelter-search-heading">避難所検索</h2>

	<div id="shelterMap" class="search-map" aria-label="青森市周辺の地図"></div>

	<form class="shelter-search-form" method="get" action="/search_results">
		<p>絞り込み項目を選択してください</p>
		<label for="criteria">絞り込み項目</label>
		<select id="criteria" name="criteria" aria-label="絞り込み項目">
			<option value="">選択してください</option>
			<option value="被害状況">被害状況</option>
			<option value="混雑状況">混雑状況</option>
			<option value="物資状況">物資状況</option>
		</select>
		<button type="submit">検索</button>
	</form>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
	const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);
	L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		attribution: '© OpenStreetMap contributors'
	}).addTo(map);
});
</script>
{% endblock %}
