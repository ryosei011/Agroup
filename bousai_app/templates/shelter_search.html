{% extends "base.html" %}

{% block title %}避難所検索 - 防災アプリ{% endblock %}

{% block content %}
<style>
	.location-search-message { margin: 12px 0 0; color: #b23b2f; font-size: 13px; }
</style>

<section class="search-page" aria-labelledby="shelter-search-heading">
	<h2 id="shelter-search-heading">避難所検索</h2>

	<div id="shelterMap" class="search-map" aria-label="青森市周辺の地図"></div>

	<form class="shelter-search-form" method="get" action="/search_results">
		<p>絞り込み項目を選択してください</p>
		<label for="criteria">絞り込み項目</label>
		<select id="criteria" name="criteria" aria-label="絞り込み項目">
			<option value="">選択してください</option>
			<option value="被害状況">被害状況</option>
			<option value="混雑状況">混雑状況</option>
			<option value="物資状況">物資状況</option>
			<option value="距離が近い順">距離が近い順</option>
		</select>
		<button type="submit">検索</button>
		<p id="location-search-message" class="location-search-message" role="status" hidden></p>
	</form>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
	const searchForm = document.querySelector('.shelter-search-form');
	const locationMessage = document.getElementById('location-search-message');
	searchForm.addEventListener('submit', function(event) {
		event.preventDefault();
		if (!navigator.geolocation) {
			locationMessage.hidden = false;
			locationMessage.textContent = 'このブラウザでは現在地を取得できません。';
			return;
		}
		locationMessage.hidden = false;
		locationMessage.textContent = '現在地を取得しています...';
		navigator.geolocation.getCurrentPosition(function(position) {
			const params = new URLSearchParams(new FormData(searchForm));
			params.set('latitude', position.coords.latitude);
			params.set('longitude', position.coords.longitude);
			window.location.href = '/search_results?' + params.toString();
		}, function() {
			locationMessage.textContent = '現在地を取得できませんでした。ブラウザの位置情報を許可してください。';
		}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
	});

	const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);
	L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		attribution: '© OpenStreetMap contributors'
	}).addTo(map);

	const mapShelters = {{ map_shelters | tojson }};
	function statusClass(status) {
		return { '◎': 'good', '○': 'normal', '△': 'caution', '×': 'bad' }[status] || 'unknown';
	}
	function openingClass(status) {
		return status === '開設中' ? 'open' : status === '開設準備中' ? 'preparing' : 'closed';
	}
	function shelterIcon(shelter) {
		return L.divIcon({
			className: 'shelter-marker',
			html: `<span class="shelter-pin shelter-pin--${openingClass(shelter.opening_status)}"></span>`,
			iconSize: [20, 20],
			iconAnchor: [10, 20],
			popupAnchor: [0, -20]
		});
	}
	function shelterPopup(shelter) {
		const value = function (field) { return shelter[field] || '未登録'; };
		return `<strong>${shelter.name}</strong><br>`
			+ `住所：${value('address')}<br>`
			+ `電話番号：${value('contact')}<br>`
			+ `開催状況：${value('opening_status')}<br>`
			+ `混雑状況：<span class="popup-status--${statusClass(shelter.crowd_status)}">${value('crowd_status')}</span><br>`
			+ `物資状況：<span class="popup-status--${statusClass(shelter.supply_status)}">${value('supply_status')}</span><br>`
			+ `被害状況：<span class="popup-status--${statusClass(shelter.damage_status)}">${value('damage_status')}</span>`;
	}
	mapShelters.forEach(function (shelter) {
		L.marker([shelter.latitude, shelter.longitude], { icon: shelterIcon(shelter) })
			.addTo(map)
			.bindPopup(shelterPopup(shelter));
	});
});
</script>
{% endblock %}
